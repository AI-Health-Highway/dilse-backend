# Run from this directory: gcloud builds submit . --project=aisteth-development --config=cloudbuild.yaml
# Cloud Build's service account needs Artifact Registry Writer, Cloud Run Admin,
# and Service Account User on the runtime identity. Creating a new repository
# also requires Artifact Registry Admin. See README.md for project setup.
substitutions:
  _REGION: asia-south1
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE: dilse-fastapi

steps:
  - id: ensure-artifact-repository
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if ! gcloud artifacts repositories describe "${_REPOSITORY}" \
          --location="${_REGION}" --project="$PROJECT_ID" > /dev/null 2>&1; then
          gcloud artifacts repositories create "${_REPOSITORY}" \
            --repository-format=docker \
            --location="${_REGION}" \
            --project="$PROJECT_ID" \
            --description="DilSay backend images"
        fi

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --update-env-vars=APP_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DB=(default),WHATSAPP_INTEGRATION_ENABLED=false,WHATSAPP_DEV_OTP=555666,ALLOW_FIXED_OTP_IN_PRODUCTION=true
      - --remove-secrets=ADMIN_KEY
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
